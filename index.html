<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT連携ページ</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      line-height: 1.7;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 130px;
      padding: 15px;
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #10a37f;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    #message {
      margin-top: 15px;
      color: #10a37f;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>ChatGPT連携ページ</h1>

    <p>
      ChatGPTに質問したい内容を入力してください。
    </p>

    <textarea id="question" placeholder="ここに質問を入力してください"></textarea>

    <button onclick="openChatGPT()">
      ChatGPTで質問する
    </button>

    <div id="message"></div>

  </div>

  <script>
    async function openChatGPT() {
      const question = document.getElementById("question").value.trim();

      if (!question) {
        alert("質問を入力してください。");
        return;
      }

      try {
        await navigator.clipboard.writeText(question);
        document.getElementById("message").textContent =
          "質問をコピーしました。ChatGPTに貼り付けてください。";
      } catch (error) {
        document.getElementById("message").textContent =
          "ChatGPTを開きます。質問をコピーして貼り付けてください。";
      }

      window.open("https://chatgpt.com/", "_blank");
    }
  </script>

</body>
</html>
